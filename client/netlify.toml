# Netlify configuration for Insta-V2 React + Vite frontend
# Single source of truth for frontend build, API proxying, and SPA routing.

[build]
  command = "npm run build"
  publish = "dist"

# 1. Backend API Proxy (evaluated before SPA fallback)
# Proxies both /api and /api/* requests to the persistent Render Express server so
# HTTP-only cookies are received and stored as first-party cookies for the Netlify origin.
# Netlify forwards request bodies, methods, query parameters, and passes through Set-Cookie headers.
[[redirects]]
  from = "/api"
  to = "https://instav2-server.onrender.com/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://instav2-server.onrender.com/api/:splat"
  status = 200
  force = true

# 2. React Router SPA Fallback (serves index.html for client-side routes like /, /login, /signup,
# /explore, /reels, /notifications, /messages, /profile, /profile/:username, etc.;
# force=false ensures static assets in dist/ are served directly without redirection)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
